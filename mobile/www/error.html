<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KARVAAN — offline</title>
    <script src="config.js"></script>
    <style>
      html, body { margin: 0; height: 100%; background: #070708; color: #ece8df; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px; box-sizing: border-box; max-width: 460px; margin: 0 auto; }
      svg { width: 54px; height: 36px; }
      .label { margin-top: 28px; font: 600 11px/1 ui-monospace, monospace; letter-spacing: .2em; text-transform: uppercase; color: #e4572e; }
      h1 { margin: 14px 0 0; font-size: 32px; line-height: 1.05; font-weight: 900; text-transform: uppercase; letter-spacing: .02em; }
      p { color: #a5a29b; line-height: 1.55; font-size: 15px; }
      button { margin-top: 18px; height: 48px; border: 0; background: #ece8df; color: #070708; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
      code { color: #ece8df; word-break: break-all; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 36 24" aria-hidden="true"><path d="M2 3h6l8 9-8 9H2l8-9Z" fill="#ece8df"/><path d="M13 3h5l8 9-8 9h-5l8-9Z" fill="#ece8df" opacity=".55"/><path d="M23 3h4l8 9-8 9h-4l8-9Z" fill="#e4572e"/></svg>
      <p class="label">No connection</p>
      <h1>Can't reach KARVAAN</h1>
      <p>Check your internet connection and try again.</p>
      <p style="font-size:13px">Trying: <code id="u"></code></p>
      <button onclick="location.replace(window.KARVAAN_URL)">Try again</button>
    </main>
    <script>document.getElementById("u").textContent = window.KARVAAN_URL || "";</script>
  </body>
</html>
